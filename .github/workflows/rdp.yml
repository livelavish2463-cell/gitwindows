name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "runneradmin" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

      - name: Install ngrok
        shell: powershell
        run: |
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP\ngrok" -Force
          Copy-Item "$env:TEMP\ngrok\ngrok.exe" "$env:TEMP\ngrok.exe" -Force

      - name: Configure ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          & "$env:TEMP\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Start RDP Tunnel
        shell: powershell
        run: |
          Start-Process "$env:TEMP\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          $tunnel = Invoke-RestMethod "http://127.0.0.1:4040/api/tunnels"
          $url = ($tunnel.tunnels | Where-Object {$_.proto -eq "tcp"}).public_url

          Write-Host "===================================="
          Write-Host "RDP ADDRESS: $url"
          Write-Host "USERNAME: runneradmin"
          Write-Host "===================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
