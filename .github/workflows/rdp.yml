name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic

          Start-Service -Name TermService

      - name: Configure RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $Password

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

      - name: Install ngrok
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:TEMP\ngrok.zip"

          Expand-Archive `
            "$env:TEMP\ngrok.zip" `
            -DestinationPath "$env:TEMP\ngrok" `
            -Force

          Copy-Item `
            "$env:TEMP\ngrok\ngrok.exe" `
            "$env:TEMP\ngrok.exe" `
            -Force

      - name: Configure ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          & "$env:TEMP\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Start RDP Tunnel
        shell: powershell
        run: |
          Start-Process `
            "$env:TEMP\ngrok.exe" `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $tunnel = Invoke-RestMethod `
            "http://127.0.0.1:4040/api/tunnels"

          $url = (
            $tunnel.tunnels |
            Where-Object { $_.proto -eq "tcp" } |
            Select-Object -First 1
          ).public_url

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       WINDOWS RDP CONNECTION"
          Write-Host "======================================"
          Write-Host "RDP ADDRESS: $url"
          Write-Host "USERNAME: runneradmin"
          Write-Host "======================================"
          Write-Host ""

      - name: Check RDP Port
        shell: powershell
        run: |
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP is running..."
          Write-Host "Keep this workflow running."

          while ($true) {
            Start-Sleep -Seconds 60
          }
